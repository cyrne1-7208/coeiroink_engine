<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>VOICEVOX Engine 設定</title>
        <link
            rel="shortcut icon"
            href="https://voicevox.hiroshiba.jp/favicon-32x32.png"
        />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
        ></script>
    </head>

    <body>
        <div class="container p-3">
            <form method="post">
                <div class="alert alert-warning" role="alert">
                    設定の変更を反映するにはエンジンの再起動が必要です。
                </div>

                <div class="mb-3">
                    <label class="form-label" for="cors_policy_mode">
                        CORS Policy Mode
                    </label>
                    <select
                        class="form-select"
                        id="cors_policy_mode"
                        aria-describedby="cors_policy_mode_help"
                        name="cors_policy_mode"
                    >
                        <option
                            value="localapps"
                            {% if cors_policy_mode == "localapps" %}selected{% endif %}
                        >
                            localapps
                        </option>
                        <option
                            value="all"
                            {% if cors_policy_mode == "all" %}selected{% endif %}
                        >
                            all
                        </option>
                    </select>
                    <div class="form-text" id="cors_policy_mode_help">
                        <p class="mb-1">
                            allはすべてのオリジンを許可します。既定はlocalappsです。
                        </p>
                        <p class="mb-1">
                            localappsは<code>app://.</code>と、<code>localhost</code>・<code>127.0.0.1</code>のHTTP/HTTPSオリジンを許可します。ポート番号付きも指定できます。
                        </p>
                        <p>
                            その他のオリジンは、下のAllow Origin欄に入力してください。
                        </p>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="allow_origin">Allow Origin</label>
                    <input
                        class="form-control"
                        type="text"
                        id="allow_origin"
                        aria-describedby="allow_origin_help"
                        name="allow_origin"
                        value="{{ allow_origin }}"
                    />
                    <div class="form-text" id="allow_origin_help">
                        許可するオリジン（例：<code>https://example.com</code>）を入力してください。複数指定する場合はスペースで区切ります。URLのパスは含めないでください。
                    </div>
                </div>

                <div
                    class="modal fade"
                    id="submitModal"
                    tabindex="-1"
                    aria-labelledby="submitModalLabel"
                    aria-hidden="true"
                >
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="submitModalLabel">
                                    設定の保存
                                </h5>
                                <button
                                    type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal"
                                    aria-label="Close"
                                ></button>
                            </div>
                            <div class="modal-body">
                                設定を保存します。よろしいですか？
                            </div>
                            <div class="modal-footer">
                                <button
                                    type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal"
                                >
                                    キャンセル
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    保存
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#submitModal"
                >
                    保存
                </button>
            </form>
        </div>
    </body>
</html>

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（例: v0.1.2+coeiroink.1.7.3）"
        required: true
        type: string
      core_ref:
        description: "組み合わせるCoreのブランチ、タグ、またはコミット"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: coeiroink-engine-release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-inputs:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      container_tag: ${{ steps.version.outputs.container_tag }}
      internal_version: ${{ steps.version.outputs.internal_version }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${#VERSION}" -gt 64 ] || [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+coeiroink\.1\.7\.3$ ]]; then
            echo "version must use the vX.Y.Z+coeiroink.1.7.3 format: $VERSION" >&2
            exit 2
          fi
          # OCI/Docker tagでは'+'を使用できないため、GHCRに渡すときだけ'-'へ置換する。
          echo "container_tag=${VERSION/+/-}" >> "$GITHUB_OUTPUT"
          echo "internal_version=${VERSION#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate-inputs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: linux-cpu
            os: ubuntu-24.04
            python: "3.12"
            extra: cpu
          - target: linux-cuda
            os: ubuntu-24.04
            python: "3.12"
            extra: cuda
          - target: linux-opencl
            os: ubuntu-24.04
            python: "3.12"
            extra: opencl
          - target: windows-cpu
            os: windows-2022
            python: "3.12"
            extra: cpu
          - target: windows-cuda
            os: windows-2022
            python: "3.12"
            extra: cuda
          - target: windows-directml
            os: windows-2022
            python: "3.12"
            extra: directml

    steps:
      - name: Check out Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coeiroink_engine
          persist-credentials: false

      - name: Check out Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cyrne1-7208/coeiroink_core
          ref: ${{ inputs.core_ref }}
          path: coeiroink_core
          persist-credentials: false

      - name: Validate Engine and Core versions
        env:
          EXPECTED_VERSION: ${{ needs.validate-inputs.outputs.internal_version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          for repository in ("coeiroink_engine", "coeiroink_core"):
              with (Path(repository) / "pyproject.toml").open("rb") as file:
                  actual = tomllib.load(file)["project"]["version"]
              if actual != expected:
                  raise SystemExit(f"{repository} version {actual!r} != {expected!r}")
          PY

      - name: Install OpenCL build dependencies
        if: matrix.target == 'linux-opencl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libsqlite3-dev \
            ocl-icd-opencl-dev \
            opencl-headers

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            coeiroink_engine/uv.lock
            coeiroink_core/uv.lock

      - name: Validate lock files
        working-directory: coeiroink_engine
        run: uv lock --check

      - name: Install the locked target environment
        working-directory: coeiroink_engine
        env:
          BACKEND: ${{ matrix.extra }}
        run: uv sync --locked --extra "$BACKEND" --group build --group dev

      - name: Check installed dependencies and imports
        working-directory: coeiroink_engine
        env:
          BACKEND: ${{ matrix.extra }}
        run: |
          uv pip check
          uv run --locked --extra "$BACKEND" --group dev python -c \
            "import coeirocore, torch, voicevox_engine; print('Engine import ok; torch', torch.__version__)"

      - name: Check target device bindings
        if: matrix.extra == 'directml' || matrix.extra == 'opencl'
        working-directory: coeiroink_engine
        env:
          BACKEND: ${{ matrix.extra }}
        run: |
          if [ "$BACKEND" = directml ]; then
            uv run --locked --extra directml --group dev python -c \
              "import torch_directml; print('DirectML bindings import ok')"
          else
            uv run --locked --extra opencl --group dev python -c \
              "import pytorch_ocl; print('OpenCL bindings import ok')"
          fi

      - name: Run lightweight Engine regression tests
        working-directory: coeiroink_engine
        env:
          BACKEND: ${{ matrix.extra }}
        run: uv run --locked --extra "$BACKEND" --group dev pytest -q test/test_mock_synthesis_engine.py

      - name: Download the pyopenjtalk dictionary
        working-directory: coeiroink_engine
        env:
          BACKEND: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 5); do
            if uv run --locked --extra "$BACKEND" --group build --group dev python -c \
              "import pyopenjtalk; pyopenjtalk._lazy_init()"; then
              dictionary_ready=true
              break
            fi
            echo "Dictionary download attempt $attempt/5 failed" >&2
            sleep 5
          done
          test "${dictionary_ready:-false}" = true

      - name: Install the locked runtime and packaging environment
        working-directory: coeiroink_engine
        env:
          BACKEND: ${{ matrix.extra }}
        run: |
          uv sync --locked --extra "$BACKEND" --group build --no-dev
          uv pip check

      - name: Build the standalone Engine
        working-directory: coeiroink_engine
        env:
          BACKEND: ${{ matrix.extra }}
        run: |
          uv run --locked --extra "$BACKEND" --group build --no-dev \
            pyinstaller --noconfirm --clean run.spec -- --backend "$BACKEND"

      - name: Start and inspect the standalone Engine
        working-directory: coeiroink_engine
        env:
          BACKEND: ${{ matrix.extra }}
          EXPECTED_VERSION: ${{ needs.validate-inputs.outputs.internal_version }}
        run: |
          uv run --locked --extra "$BACKEND" --group build --no-dev python \
            build_util/check_release_build.py \
            --dist-dir dist/run \
            --expected-version "$EXPECTED_VERSION"

      - name: Create split 7-Zip archives
        working-directory: coeiroink_engine
        env:
          PACKAGE_NAME: coeiroink-engine-${{ matrix.target }}-${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Windowsでは起動検査直後に実行ファイルのハンドル解放が遅れるため、移動だけ再試行する。
          for attempt in $(seq 1 10); do
            if mv dist/run "$TARGET"; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Failed to move dist/run to $TARGET after 10 attempts" >&2
              exit 1
            fi
            sleep 2
          done
          rm -rf .venv build

          # GitHub Releaseの単一ファイル上限を超えないよう、VOICEVOXと同じ1,900 MB単位で分割する。
          7z -r -v1900m a "$PACKAGE_NAME.7z" "$TARGET/"
          ls "$PACKAGE_NAME".7z.* > "$PACKAGE_NAME.7z.txt"

          python - <<'PY'
          import os
          from pathlib import Path

          package_name = os.environ["PACKAGE_NAME"]
          limit = 2_000_000_000
          parts = sorted(Path.cwd().glob(f"{package_name}.7z.[0-9]*"))
          if not parts:
              raise SystemExit("No split 7-Zip archive was created")
          for part in parts:
              if part.stat().st_size > limit:
                  raise SystemExit(f"Release asset exceeds 2 GB: {part}")
          PY

      - name: Upload target archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coeiroink-engine-${{ matrix.target }}-7z
          path: coeiroink_engine/coeiroink-engine-${{ matrix.target }}-${{ inputs.version }}.7z.*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish Engine release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # GitHub Releaseの作成・更新にだけ書き込み権限を与える。
      contents: write
    steps:
      - name: Download all target archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coeiroink-engine-*-7z
          path: release-assets
          merge-multiple: true

      - name: Publish or update the GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.version }}
          commit: ${{ github.sha }}
          artifacts: release-assets/*.7z.*
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true

  publish-linux-containers:
    name: Publish Linux ${{ matrix.backend }} container
    needs: [validate-inputs, build, publish]
    if: needs.publish.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        backend: [cpu, cuda, opencl]
    permissions:
      contents: read
      # 3種類のLinuxイメージをGHCRへ公開するために必要。
      packages: write
    uses: ./.github/workflows/build-engine-container.yml
    with:
      tag: ${{ needs.validate-inputs.outputs.container_tag }}
      push: true
      backend: ${{ matrix.backend }}
      core_ref: ${{ inputs.core_ref }}
      publish_latest: true

  test-linux-cpu-container:
    name: Test published Linux CPU container
    needs: [validate-inputs, publish-linux-containers]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-engine-container.yml
    with:
      image: ${{ format('ghcr.io/{0}:{1}-cpu', github.repository, needs.validate-inputs.outputs.container_tag) }}
      backend: cpu

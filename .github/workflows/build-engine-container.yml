name: build-engine-container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCRへ保存するイメージタグ"
        required: true
        type: string
      push:
        description: "ビルド後にGHCRへpushする"
        required: true
        type: boolean
        default: false

concurrency:
  group: coeiroink-engine-container-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Linux CPU container
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coeiroink_engine
          persist-credentials: false

      - name: Check out adjacent Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cyrne1-7208/coeiroink_core
          ref: main
          path: coeiroink_core
          persist-credentials: false

      - name: Validate the Docker build context
        run: |
          test -f coeiroink_engine/uv.lock
          test -f coeiroink_engine/Dockerfile
          test -d coeiroink_core

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR only
        if: inputs.push == true
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and validate the GHCR image name
        id: image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "tag must contain only ASCII letters, digits, '.', '_' or '-'" >&2
            exit 2
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build the CPU container without GPU runtime execution
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: coeiroink_engine/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.image.outputs.name }}
          provenance: false
          sbom: false

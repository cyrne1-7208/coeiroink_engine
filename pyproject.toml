[build-system]
requires = ["setuptools>=73,<74", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "coeiroink-engine"
version = "0.1.0"
description = "COEIROINK Engine HTTP server"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "coeirocore",
    "fastapi>=0.141,<0.142",
    "jinja2>=3.1.4,<4",
    "numpy>=2.3,<2.4",
    "packaging>=24,<27",
    "platformdirs>=4.2,<5",
    "pydantic>=2.13,<3",
    "pyopenjtalk @ git+https://github.com/r9y9/pyopenjtalk.git@v0.4.1",
    "pyyaml>=6.0.1,<7",
    "requests>=2.32,<3",
    "scipy>=1.16,<2",
    "soundfile>=0.14,<1",
    "starlette>=1.6,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
# EngineのprofileをCoreへ転送し、Coreの実行backendと依存wheelを必ず一致させる。
cpu = [
    "coeirocore[cpu]",
    "espnet @ git+https://github.com/espnet/espnet.git@v.202604-patch1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
]
cuda = [
    "coeirocore[cuda]",
    "espnet @ git+https://github.com/espnet/espnet.git@v.202604-patch1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
]
directml = [
    # torch-directmlが対応するWindows用wheelに合わせ、DirectMLだけPython 3.12とTorch 2.4.1へ制限する。
    "coeirocore[directml]",
    "espnet @ git+https://github.com/espnet/espnet.git@v.202604-patch1 ; sys_platform == 'win32' and python_version < '3.13'",
    "torch==2.4.1; sys_platform == 'win32' and python_version < '3.13'",
    "torchaudio==2.4.1; sys_platform == 'win32' and python_version < '3.13'",
    "torch-directml==0.2.5.dev240914; sys_platform == 'win32' and python_version < '3.13'",
]
opencl = [
    # OpenCLはLinuxでCUDAを利用できないGPU向けのPrivateUse1 backendとして個別に導入する。
    "coeirocore[opencl]",
    "coeiroink-opencl==0.1.0; sys_platform == 'linux'",
    "espnet @ git+https://github.com/espnet/espnet.git@v.202604-patch1 ; sys_platform == 'linux'",
    "pyopencl>=2026.1.2,<2027; sys_platform == 'linux'",
    "torch==2.10.0; sys_platform == 'linux'",
    "torchaudio==2.10.0; sys_platform == 'linux'",
]

[dependency-groups]
build = [
    "Cython>=3.1,<4",
    "cmake>=3.31,<4",
    "ninja>=1.11,<2",
    "patchelf>=0.19,<1; sys_platform == 'linux'",
    "setuptools>=73,<74",
    "setuptools-scm>=8,<9",
    "wheel>=0.45,<1",
]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
licenses = ["pip-licenses>=5,<6"]

[tool.uv]
default-groups = []
# 異なるbackend wheelを同一環境へ混在させないよう、全profileを相互排他にする。
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
    [
        { extra = "cpu" },
        { extra = "directml" },
    ],
    [
        { extra = "cpu" },
        { extra = "opencl" },
    ],
    [
        { extra = "cuda" },
        { extra = "directml" },
    ],
    [
        { extra = "cuda" },
        { extra = "opencl" },
    ],
    [
        { extra = "directml" },
        { extra = "opencl" },
    ],
    # local Coreは別projectなので、Core内の排他関係とEngine/Core間でprofileが食い違う組み合わせもrootから宣言する。
    [
        { package = "coeirocore", extra = "cpu" },
        { package = "coeirocore", extra = "cuda" },
    ],
    [
        { package = "coeirocore", extra = "cpu" },
        { package = "coeirocore", extra = "directml" },
    ],
    [
        { package = "coeirocore", extra = "cpu" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { package = "coeirocore", extra = "cuda" },
        { package = "coeirocore", extra = "directml" },
    ],
    [
        { package = "coeirocore", extra = "cuda" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { package = "coeirocore", extra = "directml" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { extra = "cpu" },
        { package = "coeirocore", extra = "cuda" },
    ],
    [
        { extra = "cpu" },
        { package = "coeirocore", extra = "directml" },
    ],
    [
        { extra = "cpu" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { extra = "cuda" },
        { package = "coeirocore", extra = "cpu" },
    ],
    [
        { extra = "cuda" },
        { package = "coeirocore", extra = "directml" },
    ],
    [
        { extra = "cuda" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { extra = "directml" },
        { package = "coeirocore", extra = "cpu" },
    ],
    [
        { extra = "directml" },
        { package = "coeirocore", extra = "cuda" },
    ],
    [
        { extra = "directml" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { extra = "opencl" },
        { package = "coeirocore", extra = "cpu" },
    ],
    [
        { extra = "opencl" },
        { package = "coeirocore", extra = "cuda" },
    ],
    [
        { extra = "opencl" },
        { package = "coeirocore", extra = "directml" },
    ],
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# Engineは隣接するCoreを明示的に利用する。配布時はこのsourceをwheelまたはgitへ置き換える。
coeirocore = { path = "../coeiroink_core", editable = true }
# ESPnetの依存名を満たしつつ、未使用のKaldi I/OをCore側のローカルガードで明示的に拒否する。
kaldiio = { path = "../coeiroink_core/compat/kaldiio" }
# OpenCL native packageはCoreのソースを参照し、Engine側のlockでも入力を明示する。
coeiroink-opencl = [
    { path = "../coeiroink_core/native/opencl", extra = "opencl" },
]
# CPUとOpenCLはCPU wheel、CUDAはcu128 wheelを同じPyTorchバージョンから解決する。
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[tool.uv.extra-build-dependencies]
# C++拡張のABI不一致を避けるため、OpenCL拡張を選択した実行時Torchと同じ版でビルドする。
coeiroink-opencl = [
    { requirement = "torch", match-runtime = true },
]

[[tool.uv.dependency-metadata]]
name = "coeiroink-opencl"
version = "0.1.0"
# backend別TorchはEngineのextraで固定するため、ローカルpackageの重複要件をlock解決へ持ち込まない。
requires-dist = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["voicevox_engine*"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
default_section = "THIRDPARTY"
ensure_newline_before_comments = true
force_grid_wrap = 0
force_single_line = false
include_trailing_comma = true
known_first_party = ["voicevox_engine"]
known_third_party = ["numpy"]
line_length = 88
multi_line_output = 3
use_parentheses = true

[tool.ruff]
target-version = "py314"
line-length = 88

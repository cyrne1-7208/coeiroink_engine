[build-system]
requires = ["setuptools>=73,<74", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "coeiroink-engine"
version = "0.2.1+coeiroink.1.7.3"
description = "COEIROINK Engine HTTP server"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "coeirocore==0.2.1+coeiroink.1.7.3",
    "fastapi>=0.141,<0.142",
    "jinja2>=3.1.4,<4",
    "kanalizer>=0.1.1,<0.2",
    "librosa>=0.11,<1",
    "numpy>=2.3,<2.4",
    "packaging>=24,<27",
    "platformdirs>=4.2,<5",
    "pydantic>=2.13,<3",
    "pyopenjtalk @ git+https://github.com/r9y9/pyopenjtalk.git@v0.4.1",
    "pyyaml>=6.0.1,<7",
    "requests>=2.32,<3",
    "scipy>=1.16,<2",
    "soundfile>=0.14,<1",
    "starlette>=1.6,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
# Engineで選んだextraをCoreにも適用し、バックエンドと依存するwheelを揃える。
cpu = [
    "coeirocore[cpu]==0.2.1+coeiroink.1.7.3",
    # ルートプロジェクトでCPU用wheelの配布先を選ぶため、Coreと同じ組み合わせを指定する。
    "torch==2.10.0",
    "torchaudio==2.10.0",
]
cuda = [
    "coeirocore[cuda]==0.2.1+coeiroink.1.7.3",
    # ルートプロジェクトでCUDA用wheelの配布先を選ぶため、Coreと同じ組み合わせを指定する。
    "torch==2.10.0",
    "torchaudio==2.10.0",
]
directml = [
    "coeirocore[directml]==0.2.1+coeiroink.1.7.3",
]
opencl = [
    "coeirocore[opencl]==0.2.1+coeiroink.1.7.3",
    # OpenCL用のsource設定を有効にし、Core内のネイティブパッケージとCPU版Torchを同じuv.lockで固定する。
    "coeiroink-opencl==0.2.1+coeiroink.1.7.3; sys_platform == 'linux'",
    "torch==2.10.0; sys_platform == 'linux'",
    "torchaudio==2.10.0; sys_platform == 'linux'",
]
sudachi = [
    # SudachiPyはRust実装を含むwheelを使い、通常のEngine構築には含めない。
    "sudachipy==0.6.11",
    "sudachidict_full==20260723",
]
soxr = [
    # Coreの高品質リサンプラーは、選択した場合だけ導入する。
    "coeirocore[soxr]==0.2.1+coeiroink.1.7.3",
]
[dependency-groups]
build = [
    "patchelf>=0.19,<1; sys_platform == 'linux'",
    "pyinstaller>=6.16,<7",
]
dev = [
    # FastAPIのTestClientが旧httpx互換経路へ戻らないよう、推奨クライアントを明示する。
    "httpx2>=2.12,<3",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
licenses = ["pip-licenses>=5,<6"]

[tool.uv]
default-groups = []
# 異なるバックエンドのwheelが同じ環境に入らないよう、各extraを同時に指定できない設定にする。
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
    [
        { extra = "cpu" },
        { extra = "directml" },
    ],
    [
        { extra = "cpu" },
        { extra = "opencl" },
    ],
    [
        { extra = "cuda" },
        { extra = "directml" },
    ],
    [
        { extra = "cuda" },
        { extra = "opencl" },
    ],
    [
        { extra = "directml" },
        { extra = "opencl" },
    ],
    # Coreは別のプロジェクトとして解決されるため、Core側のextraも同時に指定できないよう設定する。
    [
        { package = "coeirocore", extra = "cpu" },
        { package = "coeirocore", extra = "cuda" },
    ],
    [
        { package = "coeirocore", extra = "cpu" },
        { package = "coeirocore", extra = "directml" },
    ],
    [
        { package = "coeirocore", extra = "cpu" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { package = "coeirocore", extra = "cuda" },
        { package = "coeirocore", extra = "directml" },
    ],
    [
        { package = "coeirocore", extra = "cuda" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { package = "coeirocore", extra = "directml" },
        { package = "coeirocore", extra = "opencl" },
    ],
    # EngineとCoreで異なるバックエンドが選ばれないようにし、Torchの配布先を一つに決める。
    [
        { extra = "cpu" },
        { package = "coeirocore", extra = "cuda" },
    ],
    [
        { extra = "cpu" },
        { package = "coeirocore", extra = "directml" },
    ],
    [
        { extra = "cpu" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { extra = "cuda" },
        { package = "coeirocore", extra = "cpu" },
    ],
    [
        { extra = "cuda" },
        { package = "coeirocore", extra = "directml" },
    ],
    [
        { extra = "cuda" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { extra = "directml" },
        { package = "coeirocore", extra = "cpu" },
    ],
    [
        { extra = "directml" },
        { package = "coeirocore", extra = "cuda" },
    ],
    [
        { extra = "directml" },
        { package = "coeirocore", extra = "opencl" },
    ],
    [
        { extra = "opencl" },
        { package = "coeirocore", extra = "cpu" },
    ],
    [
        { extra = "opencl" },
        { package = "coeirocore", extra = "cuda" },
    ],
    [
        { extra = "opencl" },
        { package = "coeirocore", extra = "directml" },
    ],
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# このソースツリーでは、隣接するCoreを使用する。
coeirocore = { path = "../coeiroink_core", editable = true }
# OpenCLのネイティブパッケージはCore内のソースを参照し、Engine側のuv.lockにも含める。
coeiroink-opencl = [
    { path = "../coeiroink_core/native/opencl", extra = "opencl" },
]
# CPUとOpenCLはCPU wheel、CUDAはcu128 wheelを同じPyTorchバージョンから解決する。
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[tool.uv.extra-build-dependencies]
# C++ ABIの不一致を避けるため、OpenCL拡張のビルド時と実行時で同じTorchを使う。
coeiroink-opencl = [
    { requirement = "torch", match-runtime = true },
]

[[tool.uv.dependency-metadata]]
name = "coeiroink-opencl"
version = "0.2.1+coeiroink.1.7.3"
# TorchのバージョンはEngineのextraで固定しているため、ローカルパッケージ側では重ねて指定しない。
requires-dist = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
license-files = ["LICENSE", "licenses/GPL-3.0.txt"]

[tool.setuptools.packages.find]
include = ["voicevox_engine*"]

[tool.ruff]
target-version = "py312"
line-length = 88
